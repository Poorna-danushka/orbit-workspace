name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  client:
    name: Client verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Verify client
        working-directory: client
        run: npm run verify
        env:
          NEXT_PUBLIC_SERVER_URL: https://api.example.test

  server:
    name: Server verification
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mongodb://127.0.0.1:27017/orbit_test?replicaSet=rs0&directConnection=true
      TEST_DATABASE_URL: mongodb://127.0.0.1:27017/orbit_test?replicaSet=rs0&directConnection=true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Start MongoDB replica set
        run: docker compose up -d mongo

      - name: Wait for MongoDB health check
        run: |
          container_id="$(docker compose ps -q mongo)"
          for attempt in $(seq 1 60); do
            status="$(docker inspect --format='{{.State.Health.Status}}' "$container_id")"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs mongo
          echo "MongoDB replica set did not become healthy." >&2
          exit 1

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npm run db:generate

      - name: Push schema to the isolated test database
        working-directory: server
        run: npm run db:push:local
        env:
          LOCAL_DATABASE_URL: mongodb://127.0.0.1:27017/orbit_test?replicaSet=rs0&directConnection=true

      - name: Verify server
        working-directory: server
        run: npm run verify

  e2e:
    name: Playwright end-to-end tests
    runs-on: ubuntu-latest
    needs:
      - client
      - server
    env:
      TEST_DATABASE_URL: mongodb://127.0.0.1:27017/orbit_test?replicaSet=rs0&directConnection=true
      DATABASE_URL: mongodb://127.0.0.1:27017/orbit_test?replicaSet=rs0&directConnection=true
      JWT_SECRET: orbit-ci-access-secret-only
      JWT_REFRESH_SECRET: orbit-ci-refresh-secret-only
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Start MongoDB replica set
        run: docker compose up -d mongo

      - name: Wait for MongoDB health check
        run: |
          container_id="$(docker compose ps -q mongo)"
          for attempt in $(seq 1 60); do
            status="$(docker inspect --format='{{.State.Health.Status}}' "$container_id")"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs mongo
          echo "MongoDB replica set did not become healthy." >&2
          exit 1

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npm run db:generate

      - name: Push schema to the isolated test database
        working-directory: server
        run: npm run db:push:local
        env:
          LOCAL_DATABASE_URL: mongodb://127.0.0.1:27017/orbit_test?replicaSet=rs0&directConnection=true

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('client/package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Run Playwright suite
        working-directory: client
        run: npx playwright test
        env:
          NEXT_PUBLIC_SERVER_URL: http://127.0.0.1:5100

      - name: Upload Playwright report after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            client/test-results/
            client/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
